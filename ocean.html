<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Spectral Ocean</title>
<style>
    :root {
        --panel: rgba(8, 14, 24, 0.72);
        --line: rgba(140, 220, 255, 0.18);
        --text: #e6f2ff;
        --muted: #8fa6bd;
        --accent: #7fe3ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #05080d; overflow: hidden; color: var(--text);
        font-family: ui-sans-serif, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: grab; touch-action: none; }
    canvas:active { cursor: grabbing; }

    .glass { background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
        backdrop-filter: blur(14px) saturate(140%); -webkit-backdrop-filter: blur(14px) saturate(140%);
        box-shadow: 0 10px 40px rgba(0,0,0,0.35); }
    body.clean .glass { display: none !important; }

    #panel { position: fixed; top: 16px; right: 16px; width: 300px; max-height: calc(100vh - 32px);
        overflow-y: auto; padding: 14px 16px 16px; font-size: 12.5px; z-index: 5; }
    #panel.collapsed .body { display: none; }
    #panel header { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    #panel h1 { font-size: 15px; font-weight: 650; letter-spacing: 0.2px; }
    #panel h2 { font-size: 10.5px; text-transform: uppercase; letter-spacing: 1.4px; color: var(--accent);
        margin: 16px 0 8px; font-weight: 600; }
    .row { margin: 9px 0; }
    .row .top { display: flex; justify-content: space-between; color: var(--muted); margin-bottom: 4px; }
    .row .top b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: var(--accent); height: 16px; }
    select { width: 100%; padding: 6px 8px; border-radius: 8px; border: 1px solid var(--line);
        background: rgba(0,0,0,0.35); color: var(--text); font-size: 12.5px; }
    .check { display: flex; align-items: center; gap: 8px; color: var(--muted); margin: 7px 0; cursor: pointer; }
    .check input { accent-color: var(--accent); }
    button { background: rgba(127, 227, 255, 0.12); color: var(--text); border: 1px solid var(--line);
        border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; }
    button:hover { background: rgba(127, 227, 255, 0.22); }
    .btns { display: flex; flex-wrap: wrap; gap: 6px; }

    #hud { position: fixed; left: 16px; top: 16px; padding: 12px 14px; font-size: 12px; z-index: 5; min-width: 240px; }
    #hud .title { font-size: 16px; font-weight: 650; margin-bottom: 6px; }
    #hud .title a { color: var(--muted); font-size: 12px; font-weight: 400; margin-left: 8px; text-decoration: none; }
    #hud .grid { display: grid; grid-template-columns: auto auto; gap: 3px 14px; color: var(--muted); }
    #hud .grid b { color: var(--text); font-weight: 500; font-variant-numeric: tabular-nums; text-align: right; }
    #hint { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 8px 14px;
        font-size: 12px; color: var(--muted); z-index: 5; white-space: nowrap; }

    #about { position: fixed; left: 16px; bottom: 16px; width: min(560px, calc(100vw - 32px)); max-height: 66vh;
        overflow-y: auto; padding: 16px 18px; font-size: 12.5px; line-height: 1.55; z-index: 6; display: none; }
    #about.open { display: block; }
    #about h3 { font-size: 14px; margin-bottom: 8px; }
    #about h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--accent); margin: 12px 0 4px; }
    #about p, #about li { color: #c4d4e4; }
    #about ul { padding-left: 18px; }
    #about .new { border-left: 2px solid var(--accent); padding-left: 10px; }

    #error { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: left;
        background: #05080d; color: #ffb4a8; font: 12px/1.45 ui-monospace, monospace; white-space: pre-wrap;
        overflow: auto; z-index: 20; }

    @media (max-width: 700px) {
        #panel { width: calc(100vw - 32px); top: auto; bottom: 16px; max-height: 45vh; }
        #hud { min-width: 0; }
        #hint { display: none; }
    }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="overlay" style="position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:2"></canvas>

<div id="hud" class="glass">
    <div class="title">Spectral Ocean <a href="index.html">← wireframes</a></div>
    <div class="grid">
        <span>Sea state</span><b id="hudSea">–</b>
        <span>Significant wave height</span><b id="hudHs">–</b>
        <span>Peak period · wavelength</span><b id="hudTp">–</b>
        <span>Whitecap cover (Monahan)</span><b id="hudWc">–</b>
        <span>Boat · depth Froude no.</span><b id="hudBoat">–</b>
        <span>Frame</span><b id="hudFps">–</b>
    </div>
</div>

<div id="panel" class="glass">
    <header>
        <h1>Controls</h1>
        <div class="btns">
            <button id="aboutBtn">How it works</button>
            <button id="collapseBtn">–</button>
        </div>
    </header>
    <div class="body" id="controls"></div>
</div>

<div id="about" class="glass"></div>
<div id="hint" class="glass">Drag to look · click the water to drop a stone · WASD/arrows move (or steer the boat) · Q/E height · H hides UI</div>
<div id="error"></div>

<script>
'use strict';

// =====================================================================
//  Spectral Ocean — WebGL2
//
//  Wind sea:  Tessendorf FFT synthesis, 3 cascades, Horvath spectrum
//  Shading:   Bruneton slope-variance BRDF, Cox–Munk sub-pixel slopes
//  Foam:      Jacobian whitecaps calibrated to Monahan's coverage law
//  Sky:       single-scattering Rayleigh + Mie + ozone
//  New:       a *dynamic spectral cascade* — an exact-dispersion
//             Fourier-space wave solver for wakes and splashes that
//             shares the filtering / foam / depth pipeline of the
//             synthesized sea; floating bodies via async GPU probes
//             with displacement inversion and hull-scale filtering.
// =====================================================================

const canvas = document.getElementById('gl');
const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, powerPreference: 'high-performance' });

function fail(msg) {
    const el = document.getElementById('error');
    el.style.display = 'grid';
    el.textContent = msg;
    throw new Error(msg);
}

if (!gl) fail('This page needs WebGL2, which this browser does not provide.');
if (!gl.getExtension('EXT_color_buffer_float')) fail('This page needs EXT_color_buffer_float (float render targets).');
gl.getExtension('OES_texture_float_linear');
const anisoExt = gl.getExtension('EXT_texture_filter_anisotropic');
const maxAniso = anisoExt ? Math.min(16, gl.getParameter(anisoExt.MAX_TEXTURE_MAX_ANISOTROPY_EXT)) : 1;

// ---------------------------------------------------------------------
//  Constants
// ---------------------------------------------------------------------
const N = 256;                        // FFT resolution (all cascades + wake)
const LOG2N = 8;
const G = 9.81;
const CASCADES = [400, 61, 11];       // patch sizes (m), non-commensurate to hide tiling
const WAKE_L = 256;                   // dynamic cascade: 256 m domain, 1 m cells
const WAKE_CELL = WAKE_L / N;
const SKY_W = 256, SKY_H = 128;
const FAR = 30000;
const PROBES = 8;

// ---------------------------------------------------------------------
//  Parameters (bound to UI)
// ---------------------------------------------------------------------
const P = {
    wind: 8, fetch: 120, swell: 0.35, depth: 200, windDir: 205, chop: 1.0, timeScale: 1,
    sunEl: 7, sunAz: 180, haze: 1.0, exposure: 0.0,
    boat: true, boatSpeed: 7, boatTurn: 2.5, chase: true, wakeView: false,
    filter: 'bruneton', foam: true, bloom: true, quality: 'high', cascadeDebug: false, bio: true,
    spray: true, autoRes: true
};

// ---------------------------------------------------------------------
//  GL helpers
// ---------------------------------------------------------------------
function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
        const numbered = src.split('\n').map((l, i) => String(i + 1).padStart(4) + ' ' + l).join('\n');
        fail('Shader compile error:\n' + gl.getShaderInfoLog(s) + '\n\n' + numbered);
    }
    return s;
}

function program(vsSrc, fsSrc) {
    const p = gl.createProgram();
    gl.attachShader(p, compile(gl.VERTEX_SHADER, vsSrc));
    gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fsSrc));
    gl.linkProgram(p);
    if (!gl.getProgramParameter(p, gl.LINK_STATUS)) fail('Program link error:\n' + gl.getProgramInfoLog(p));
    const u = {}, units = {};
    const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
    gl.useProgram(p);
    let unit = 0;
    for (let i = 0; i < n; i++) {
        const info = gl.getActiveUniform(p, i);
        const name = info.name.replace(/\[0\]$/, '');
        u[name] = gl.getUniformLocation(p, info.name);
        if (info.type === gl.SAMPLER_2D) { units[name] = unit; gl.uniform1i(u[name], unit++); }
    }
    return { p, u, units };
}

function bindTex(prog, name, tex) {
    const unit = prog.units[name];
    if (unit === undefined) return;
    gl.activeTexture(gl.TEXTURE0 + unit);
    gl.bindTexture(gl.TEXTURE_2D, tex);
}

function makeTex(w, h, { internal = gl.RGBA16F, filter = gl.LINEAR, mip = false, wrap = gl.REPEAT, aniso = false } = {}) {
    const t = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, t);
    const levels = mip ? Math.floor(Math.log2(Math.max(w, h))) + 1 : 1;
    gl.texStorage2D(gl.TEXTURE_2D, levels, internal, w, h);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, mip ? gl.LINEAR_MIPMAP_LINEAR : filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, filter);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, wrap);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, wrap);
    if (aniso && anisoExt) gl.texParameterf(gl.TEXTURE_2D, anisoExt.TEXTURE_MAX_ANISOTROPY_EXT, maxAniso);
    t.w = w; t.h = h;
    return t;
}

function makeFBO(textures) {
    const f = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, f);
    textures.forEach((t, i) => gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0));
    gl.drawBuffers(textures.map((_, i) => gl.COLOR_ATTACHMENT0 + i));
    const status = gl.checkFramebufferStatus(gl.FRAMEBUFFER);
    if (status !== gl.FRAMEBUFFER_COMPLETE) fail('Framebuffer incomplete: 0x' + status.toString(16));
    f.w = textures[0].w; f.h = textures[0].h;
    return f;
}

const emptyVAO = gl.createVertexArray();
function drawFullscreen(target) {
    gl.bindFramebuffer(gl.FRAMEBUFFER, target);
    if (target) gl.viewport(0, 0, target.w, target.h);
    gl.bindVertexArray(emptyVAO);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
}

function mipmap(tex) {
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.generateMipmap(gl.TEXTURE_2D);
}

// ---------------------------------------------------------------------
//  Small matrix library (column-major, OpenGL conventions)
// ---------------------------------------------------------------------
const M4 = {
    perspective(fovy, aspect, near, far) {
        const f = 1 / Math.tan(fovy / 2), nf = 1 / (near - far);
        return new Float32Array([f / aspect, 0, 0, 0, 0, f, 0, 0, 0, 0, (far + near) * nf, -1, 0, 0, 2 * far * near * nf, 0]);
    },
    lookAt(e, t, up) {
        let zx = e[0] - t[0], zy = e[1] - t[1], zz = e[2] - t[2];
        let l = Math.hypot(zx, zy, zz); zx /= l; zy /= l; zz /= l;
        let xx = up[1] * zz - up[2] * zy, xy = up[2] * zx - up[0] * zz, xz = up[0] * zy - up[1] * zx;
        l = Math.hypot(xx, xy, xz); xx /= l; xy /= l; xz /= l;
        const yx = zy * xz - zz * xy, yy = zz * xx - zx * xz, yz = zx * xy - zy * xx;
        return new Float32Array([xx, yx, zx, 0, xy, yy, zy, 0, xz, yz, zz, 0,
            -(xx * e[0] + xy * e[1] + xz * e[2]), -(yx * e[0] + yy * e[1] + yz * e[2]), -(zx * e[0] + zy * e[1] + zz * e[2]), 1]);
    },
    mul(a, b) {
        const o = new Float32Array(16);
        for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) {
            let s = 0;
            for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k];
            o[c * 4 + r] = s;
        }
        return o;
    },
    invert(m) {
        const inv = new Float32Array(16);
        const [a00, a01, a02, a03, a10, a11, a12, a13, a20, a21, a22, a23, a30, a31, a32, a33] = m;
        const b00 = a00 * a11 - a01 * a10, b01 = a00 * a12 - a02 * a10, b02 = a00 * a13 - a03 * a10;
        const b03 = a01 * a12 - a02 * a11, b04 = a01 * a13 - a03 * a11, b05 = a02 * a13 - a03 * a12;
        const b06 = a20 * a31 - a21 * a30, b07 = a20 * a32 - a22 * a30, b08 = a20 * a33 - a23 * a30;
        const b09 = a21 * a32 - a22 * a31, b10 = a21 * a33 - a23 * a31, b11 = a22 * a33 - a23 * a32;
        const det = 1 / (b00 * b11 - b01 * b10 + b02 * b09 + b03 * b08 - b04 * b07 + b05 * b06);
        inv[0] = (a11 * b11 - a12 * b10 + a13 * b09) * det; inv[1] = (a02 * b10 - a01 * b11 - a03 * b09) * det;
        inv[2] = (a31 * b05 - a32 * b04 + a33 * b03) * det; inv[3] = (a22 * b04 - a21 * b05 - a23 * b03) * det;
        inv[4] = (a12 * b08 - a10 * b11 - a13 * b07) * det; inv[5] = (a00 * b11 - a02 * b08 + a03 * b07) * det;
        inv[6] = (a32 * b02 - a30 * b05 - a33 * b01) * det; inv[7] = (a20 * b05 - a22 * b02 + a23 * b01) * det;
        inv[8] = (a10 * b10 - a11 * b08 + a13 * b06) * det; inv[9] = (a01 * b08 - a00 * b10 - a03 * b06) * det;
        inv[10] = (a30 * b04 - a31 * b02 + a33 * b00) * det; inv[11] = (a21 * b02 - a20 * b04 - a23 * b00) * det;
        inv[12] = (a11 * b07 - a10 * b09 - a12 * b06) * det; inv[13] = (a00 * b09 - a01 * b07 + a02 * b06) * det;
        inv[14] = (a31 * b01 - a30 * b03 - a32 * b00) * det; inv[15] = (a20 * b03 - a21 * b01 + a22 * b00) * det;
        return inv;
    },
    transform(m, v) {
        const x = v[0], y = v[1], z = v[2], w = v[3];
        return [m[0] * x + m[4] * y + m[8] * z + m[12] * w, m[1] * x + m[5] * y + m[9] * z + m[13] * w,
            m[2] * x + m[6] * y + m[10] * z + m[14] * w, m[3] * x + m[7] * y + m[11] * z + m[15] * w];
    }
};

// =====================================================================
//  1. Directional wave spectrum (CPU, regenerated when sea state changes)
//     JONSWAP (Hasselmann 1973) + TMA shallow-water attenuation
//     (Bouws 1985) + Donelan–Banner spreading with Horvath's swell
//     elongation (Horvath 2015).
// =====================================================================
function mulberry32(a) {
    return function () {
        a |= 0; a = a + 0x6D2B79F5 | 0;
        let t = Math.imul(a ^ a >>> 15, 1 | a);
        t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
}

function tmaAttenuation(omega, depth) {
    const wh = omega * Math.sqrt(depth / G);
    if (wh <= 1) return 0.5 * wh * wh;
    if (wh < 2) return 1 - 0.5 * (2 - wh) * (2 - wh);
    return 1;
}

function donelanBannerBeta(r) {
    if (r < 0.95) return 2.61 * Math.pow(r, 1.3);
    if (r < 1.6) return 2.28 * Math.pow(r, -1.3);
    return Math.pow(10, -0.4 + 0.8393 * Math.exp(-0.567 * Math.log(r * r)));
}

function spreadingRaw(theta, beta, s) {
    const c = Math.cosh(beta * theta);
    return (1 / (c * c)) * Math.pow(Math.abs(Math.cos(theta / 2)), 2 * s);
}

// Inverse standard normal CDF (Acklam's rational approximation)
function probit(p) {
    const a = [-39.69683028665376, 220.9460984245205, -275.9285104469687, 138.357751867269, -30.66479806614716, 2.506628277459239];
    const b = [-54.47609879822406, 161.5858368580409, -155.6989798598866, 66.80131188771972, -13.28068155288572];
    const c = [-0.007784894002430293, -0.3223964580411365, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783];
    const d = [0.007784695709041462, 0.3224671290700398, 2.445134137142996, 3.754408661907416];
    const q = Math.min(Math.max(p, 1e-9), 1 - 1e-9);
    if (q < 0.02425) {
        const r = Math.sqrt(-2 * Math.log(q));
        return (((((c[0] * r + c[1]) * r + c[2]) * r + c[3]) * r + c[4]) * r + c[5]) / ((((d[0] * r + d[1]) * r + d[2]) * r + d[3]) * r + 1);
    }
    if (q > 1 - 0.02425) return -probit(1 - q);
    const r = q - 0.5, t = r * r;
    return (((((a[0] * t + a[1]) * t + a[2]) * t + a[3]) * t + a[4]) * t + a[5]) * r / (((((b[0] * t + b[1]) * t + b[2]) * t + b[3]) * t + b[4]) * t + 1);
}

const spectrumStats = { hs: 0, tp: 0, lp: 0, unresolved: [1e-3, 1e-3], sigmaJ: [0, 0, 0], whitecap: 0 };

function buildSpectra() {
    const U = Math.max(P.wind, 0.5);
    const F = P.fetch * 1000;
    const alpha = 0.076 * Math.pow(U * U / (F * G), 0.22);
    const wp = 22 * Math.pow(G * G / (U * F), 1 / 3);
    const xi = P.swell;

    // Normalisation table for the combined spreading function (over omega/omega_p)
    const TB = 160, rMin = 0.1, rMax = 12;
    const norm = new Float32Array(TB), betas = new Float32Array(TB), swellS = new Float32Array(TB);
    for (let b = 0; b < TB; b++) {
        const r = rMin * Math.pow(rMax / rMin, (b + 0.5) / TB);
        const beta = donelanBannerBeta(r);
        const s = 16 * Math.tanh(1 / r) * xi * xi;
        let sum = 0;
        const M = 256;
        for (let j = 0; j < M; j++) sum += spreadingRaw(-Math.PI + (j + 0.5) * 2 * Math.PI / M, beta, s);
        norm[b] = 1 / (sum * 2 * Math.PI / M);
        betas[b] = beta; swellS[b] = s;
    }

    const bounds = [0, 2 * Math.PI / CASCADES[1] * 6, 2 * Math.PI / CASCADES[2] * 6, Infinity];
    const kCap = 60;
    let variance = 0, varU = 0, varC = 0;
    const out = [];

    for (let c = 0; c < CASCADES.length; c++) {
        const L = CASCADES[c];
        const dk = 2 * Math.PI / L;
        const rng = mulberry32(9137 + c * 7919);
        const h0 = new Float32Array(N * N * 2);
        const kLo = bounds[c], kHi = bounds[c + 1];
        let cascadeK2 = 0;

        for (let m = 0; m < N; m++) {
            for (let n = 0; n < N; n++) {
                // Always consume randoms so phases are stable when parameters change
                const u1 = Math.max(rng(), 1e-9), u2 = rng();
                const rad = Math.sqrt(-2 * Math.log(u1));
                const g1 = rad * Math.cos(2 * Math.PI * u2), g2 = rad * Math.sin(2 * Math.PI * u2);

                if (n === N / 2 || m === N / 2) continue;
                const kx = dk * (n < N / 2 ? n : n - N);
                const kz = dk * (m < N / 2 ? m : m - N);
                const k = Math.hypot(kx, kz);
                if (k === 0 || k < kLo || k >= kHi) continue;

                const kh = Math.min(k * P.depth, 20);
                const th = Math.tanh(kh);
                const omega = Math.sqrt(G * k * th);
                const ch = Math.cosh(kh);
                const dwdk = G * (th + kh / (ch * ch)) / (2 * omega);

                const S_w = alpha * G * G / Math.pow(omega, 5) * Math.exp(-1.25 * Math.pow(wp / omega, 4)) *
                    Math.pow(3.3, Math.exp(-((omega - wp) ** 2) / (2 * (omega <= wp ? 0.0049 : 0.0081) * wp * wp)));
                const r = omega / wp;
                const b = Math.min(TB - 1, Math.max(0, Math.floor(Math.log(r / rMin) / Math.log(rMax / rMin) * TB)));
                const theta = Math.atan2(kz, kx);
                const D = spreadingRaw(theta, betas[b], swellS[b]) * norm[b];

                const S = S_w * tmaAttenuation(omega, P.depth) * D * dwdk / k * Math.exp(-((k / kCap) ** 2));
                const amp = 0.5 * Math.sqrt(S) * dk;
                const i = (m * N + n) * 2;
                h0[i] = g1 * amp;
                h0[i + 1] = g2 * amp;

                const e = S * dk * dk;
                variance += e;
                varU += kx * kx * e;
                varC += kz * kz * e;
                cascadeK2 += k * k * e;
            }
        }

        // Pack h0(k) and conj(h0(-k)) so the GPU never needs a mirrored lookup
        const packed = new Float32Array(N * N * 4);
        for (let m = 0; m < N; m++) for (let n = 0; n < N; n++) {
            const i = (m * N + n);
            const j = (((N - m) % N) * N + ((N - n) % N));
            packed[i * 4] = h0[i * 2];
            packed[i * 4 + 1] = h0[i * 2 + 1];
            packed[i * 4 + 2] = h0[j * 2];
            packed[i * 4 + 3] = -h0[j * 2 + 1];
        }
        out.push(packed);
        // J - 1 ≈ -chop·|k|·h per mode, so its spread follows from the spectrum
        spectrumStats.sigmaJ[c] = Math.sqrt(cascadeK2);
    }

    // Cox & Munk (1954) measured total slope variance; whatever the
    // spectrum cannot resolve is handed to the BRDF (Bruneton 2010).
    const cmU = 0.00316 * U, cmC = 0.003 + 0.00192 * U;
    spectrumStats.unresolved = [Math.max(cmU - varU, 2e-4), Math.max(cmC - varC, 2e-4)];
    spectrumStats.hs = 4 * Math.sqrt(variance);
    spectrumStats.tp = 2 * Math.PI / wp;
    spectrumStats.lp = 2 * Math.PI * G / (wp * wp);
    // Whitecap coverage law (Monahan & O'Muircheartaigh 1980)
    spectrumStats.whitecap = Math.min(0.3, 3.84e-6 * Math.pow(U, 3.41));
    return out;
}

// =====================================================================
//  2. Shaders
// =====================================================================
const FULLSCREEN_VS = `#version 300 es
out vec2 vUv;
void main() {
    vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
    vUv = p;
    gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

const COMMON = `#version 300 es
precision highp float;
precision highp int;
precision highp sampler2D;
const float PI = 3.14159265359;
const int N = ${N};
vec2 cmul(vec2 a, vec2 b) { return vec2(a.x * b.x - a.y * b.y, a.x * b.y + a.y * b.x); }
vec2 cpack(vec2 a, vec2 b) { return vec2(a.x - b.y, a.y + b.x); } // a + i*b

// Height spectrum h(k) -> the 8 spectra we need (displacement, slopes,
// Jacobian terms), packed as 4 complex pairs of real fields.
void derivSpectra(vec2 h, vec2 k, out vec4 o0, out vec4 o1) {
    float kl = length(k);
    vec2 ih = vec2(-h.y, h.x);
    float ik = kl > 1e-6 ? 1.0 / kl : 0.0;
    vec2 dx = ih * k.x * ik, dz = ih * k.y * ik;
    vec2 dydx = ih * k.x, dydz = ih * k.y;
    vec2 dxdx = -h * k.x * k.x * ik, dzdz = -h * k.y * k.y * ik, dxdz = -h * k.x * k.y * ik;
    o0 = vec4(cpack(dx, h), cpack(dz, dydx));
    o1 = vec4(cpack(dydz, dxdx), cpack(dzdz, dxdz));
}
vec2 waveNumber(ivec2 p, float L) {
    return 2.0 * PI * vec2(p.x < N / 2 ? p.x : p.x - N, p.y < N / 2 ? p.y : p.y - N) / L;
}
`;

// ---- Wind sea: time evolution of the synthesized spectrum (Tessendorf 2001)
const SPECTRUM_FS = COMMON + `
uniform sampler2D uH0;
uniform float uL, uTime, uDepth;
layout(location = 0) out vec4 o0;
layout(location = 1) out vec4 o1;
void main() {
    ivec2 p = ivec2(gl_FragCoord.xy);
    vec2 k = waveNumber(p, uL);
    float kl = length(k);
    vec4 h0 = texelFetch(uH0, p, 0);
    float w = sqrt(9.81 * kl * tanh(min(kl * uDepth, 20.0)));
    float ph = mod(w * uTime, 2.0 * PI);
    vec2 e = vec2(cos(ph), sin(ph));
    vec2 h = cmul(h0.xy, e) + cmul(h0.zw, vec2(e.x, -e.y));
    derivSpectra(h, k, o0, o1);
}`;

// ---- One radix-2 Stockham pass over `count` RGBA textures (2 complex each)
const fftShader = count => COMMON + `
uniform int uStage, uStageIdx, uHoriz;
uniform sampler2D uTwiddle;   // exact twiddles (double precision on the CPU)
${[...Array(count)].map((_, i) => `uniform sampler2D uIn${i};\nlayout(location = ${i}) out vec4 o${i};`).join('\n')}
vec4 butterfly(sampler2D t, ivec2 pe, ivec2 po, vec2 w) {
    vec4 a = texelFetch(t, pe, 0), b = texelFetch(t, po, 0);
    return vec4(a.xy + cmul(w, b.xy), a.zw + cmul(w, b.zw));
}
void main() {
    ivec2 p = ivec2(gl_FragCoord.xy);
    int i = uHoriz == 1 ? p.x : p.y;
    int hs = uStage / 2;
    int e = (i / uStage) * hs + (i % hs);
    int o = e + N / 2;
    ivec2 pe = uHoriz == 1 ? ivec2(e, p.y) : ivec2(p.x, e);
    ivec2 po = uHoriz == 1 ? ivec2(o, p.y) : ivec2(p.x, o);
    vec2 w = texelFetch(uTwiddle, ivec2(i, uStageIdx), 0).xy;
    ${[...Array(count)].map((_, i) => `o${i} = butterfly(uIn${i}, pe, po, w);`).join('\n    ')}
}`;

// ---- Unpack transformed fields into displacement + slope moments
const ASSEMBLE_FS = COMMON + `
uniform sampler2D uIn0, uIn1;
uniform float uChop;
layout(location = 0) out vec4 oDisp;
layout(location = 1) out vec4 oSlope;
void main() {
    ivec2 p = ivec2(gl_FragCoord.xy);
    vec4 a = texelFetch(uIn0, p, 0), b = texelFetch(uIn1, p, 0);
    float dx = a.x, dy = a.y, dz = a.z, dydx = a.w;
    float dydz = b.x, dxdx = b.y, dzdz = b.z, dxdz = b.w;
    float jxx = 1.0 + uChop * dxdx, jzz = 1.0 + uChop * dzdz, jxz = uChop * dxdz;
    float J = jxx * jzz - jxz * jxz;
    oDisp = vec4(uChop * dx, dy, uChop * dz, J);
    // First and second slope moments: their mip-maps give mean slope and
    // slope variance over any footprint (Bruneton, Neyret & Holzschuch 2010)
    oSlope = vec4(dydx, dydz, dydx * dydx, dydz * dydz);
}`;

// ---- Whitecaps: inject where the surface folds, then decay
//      (Dupuy & Bruneton 2012). The threshold is set on the CPU so the
//      injected fraction follows Monahan's coverage law. The wake variant
//      also scrolls with its domain and adds turbulent stern foam.
const FOAM_FS = COMMON + `
uniform sampler2D uPrev, uDisp;
uniform float uDt, uThreshold, uGain, uDecay, uCell, uBoatOn, uBoatSpeed;
uniform ivec2 uShift;
uniform vec2 uBoatPos, uBoatDir;
uniform vec3 uBoatSize;
out vec4 o;
void main() {
    ivec2 p = ivec2(gl_FragCoord.xy);
    float J = texelFetch(uDisp, p, 0).w;
    float prev = texelFetch(uPrev, (p + uShift + ivec2(N * 8)) % N, 0).r;
    float inject = clamp((uThreshold - J) * uGain, 0.0, 1.0);
    if (uBoatOn > 0.5) {
        vec2 x = (vec2(p) - float(N) * 0.5) * uCell - uBoatPos;
        float a = dot(x, uBoatDir), c = dot(x, vec2(-uBoatDir.y, uBoatDir.x));
        float L = uBoatSize.x, B = uBoatSize.y;
        float speed = clamp(uBoatSpeed / 6.0, 0.0, 1.5);
        // propeller wash behind the transom
        float stern = exp(-pow((a + 0.5 * L) / (0.25 * L), 2.0) - pow(c / (0.28 * B), 2.0));
        // bow spray sheets running along both sides of the hull
        float side = exp(-pow((abs(c) - 0.5 * B) / (0.25 * B), 2.0)) * smoothstep(-0.2 * L, 0.35 * L, a) * (1.0 - smoothstep(0.35 * L, 0.55 * L, a));
        inject = max(inject, clamp(stern * speed * 0.9 + side * speed * 0.45, 0.0, 1.0));
    }
    float f = prev * exp(-uDt * uDecay) + inject * uDt * 2.2;
    o = vec4(min(f, 1.2), inject, 0.0, 1.0);
}`;

// ---- Dynamic spectral cascade, step 1 (real space): recentre the domain,
//      absorb at the edges, and apply boat pressure + stone impulses.
//      State is (h, phi): surface height and surface velocity potential.
const WAKE_SOURCE_FS = COMMON + `
uniform sampler2D uState;
uniform ivec2 uShift;
uniform float uDt, uCell, uBoatOn;
uniform vec2 uBoatPos, uBoatDir;
uniform vec3 uBoatSize;          // length, beam, draft
uniform vec4 uSplash;            // x, z (domain-relative), radius, depth
out vec4 o;
void main() {
    ivec2 p = ivec2(gl_FragCoord.xy);
    vec2 s = texelFetch(uState, (p + uShift + ivec2(N * 8)) % N, 0).xy;
    float h = s.x, phi = s.y;
    vec2 x = (vec2(p) - float(N) * 0.5) * uCell;

    // Absorbing sponge: waves leaving the window fade instead of wrapping
    vec2 e = abs(vec2(p) - float(N) * 0.5) / (float(N) * 0.5);
    float sponge = smoothstep(0.68, 0.98, max(e.x, e.y));
    float damp = exp(-uDt * sponge * 2.5);
    h *= damp; phi *= damp;

    // Moving pressure patch: dphi/dt = -g h - p/rho, with p/rho = g * draft * footprint
    vec2 r = x - uBoatPos;
    float a = dot(r, uBoatDir), c = dot(r, vec2(-uBoatDir.y, uBoatDir.x));
    float fp = exp(-2.8 * pow(a / (0.5 * uBoatSize.x), 2.0) - 2.8 * pow(c / (0.5 * uBoatSize.y), 2.0));
    phi -= uDt * 9.81 * uBoatSize.z * fp * uBoatOn;

    // Stone / click: initial depression (Cauchy-Poisson problem)
    if (uSplash.w != 0.0) {
        vec2 rs = x - uSplash.xy;
        h -= uSplash.w * exp(-dot(rs, rs) / (uSplash.z * uSplash.z));
    }
    o = vec4(h, -phi, 0.0, 0.0);   // conjugated: the inverse kernel then gives a forward FFT
}`;

// ---- Dynamic spectral cascade, step 2 (Fourier space): every mode of the
//      linearised free surface is a harmonic oscillator, advanced *exactly*
//      by a rotation of angle omega(k)·dt with the same finite-depth
//      dispersion as the wind sea. Also emits the derivative spectra.
const WAKE_K_FS = COMMON + `
uniform sampler2D uIn;
uniform float uL, uDt, uDepth;
layout(location = 0) out vec4 o0;
layout(location = 1) out vec4 o1;
layout(location = 2) out vec4 o2;
void main() {
    ivec2 p = ivec2(gl_FragCoord.xy);
    ivec2 pm = ivec2((N - p.x) % N, (N - p.y) % N);
    float norm = 1.0 / float(N * N);
    vec2 Rk = texelFetch(uIn, p, 0).xy, Rm = texelFetch(uIn, pm, 0).xy;
    vec2 Zk = vec2(Rk.x, -Rk.y) * norm;            // FFT of (h + i phi)
    vec2 cZm = vec2(Rm.x, Rm.y) * norm;            // conj(Z(-k))
    vec2 H = 0.5 * (Zk + cZm);
    vec2 D = Zk - cZm;
    vec2 Phi = 0.5 * vec2(D.y, -D.x);               // (Z - conj Z(-k)) / 2i

    vec2 k = waveNumber(p, uL);
    float kl = length(k);
    float K = kl * tanh(min(kl * uDepth, 20.0));
    float w = sqrt(9.81 * K);
    float s = sqrt(K / 9.81);                       // K / omega
    vec2 u = H, v = Phi * s;
    float c = cos(w * uDt), sn = sin(w * uDt);
    float damp = exp(-(0.015 + 0.004 * kl * kl) * uDt);   // weak viscous-like decay
    vec2 u2 = (u * c + v * sn) * damp;
    vec2 v2 = (-u * sn + v * c) * damp;
    vec2 H2 = u2;
    vec2 Phi2 = s > 1e-6 ? v2 / s : Phi;
    if (p.x == N / 2 || p.y == N / 2) { H2 = vec2(0.0); Phi2 = vec2(0.0); }

    derivSpectra(H2, k, o0, o1);
    o2 = vec4(cpack(H2, Phi2), 0.0, 0.0);
}`;

// ---- Atmosphere --------------------------------------------------------
const SKY_COMMON = `
uniform sampler2D uSky;
vec2 skyUV(vec3 d) {
    float az = atan(d.x, d.z);
    float e = asin(clamp(d.y, -1.0, 1.0));
    return vec2(az / (2.0 * PI) + 0.5, 0.5 + 0.5 * sign(e) * sqrt(abs(e) / (0.5 * PI)));
}
vec3 skyLookup(vec3 d, float lod) { return textureLod(uSky, skyUV(d), lod).rgb; }
`;

// Single-scattering Rayleigh + Mie + ozone absorption (Nishita et al. 1993;
// ozone layer as in Bruneton 2017 / Hillaire 2020), stored in a lat-long
// LUT with extra resolution at the horizon.
const SKY_LUT_FS = COMMON + `
in vec2 vUv;
uniform vec3 uSunDir;
uniform float uHaze, uSunI;
out vec4 o;
const float Rg = 6360e3, Rt = 6420e3;
const vec3 bR = vec3(5.802e-6, 13.558e-6, 33.1e-6);
const vec3 bO = vec3(0.650e-6, 1.881e-6, 0.085e-6);
float ozone(float h) { return max(0.0, 1.0 - abs(h - 25e3) / 15e3); }
vec2 raySphere(vec3 ro, vec3 rd, float r) {
    float b = dot(ro, rd), c = dot(ro, ro) - r * r, d = b * b - c;
    if (d < 0.0) return vec2(-1.0);
    d = sqrt(d);
    return vec2(-b - d, -b + d);
}
void main() {
    float az = (vUv.x - 0.5) * 2.0 * PI;
    float t = (vUv.y - 0.5) * 2.0;
    float e = max(sign(t) * t * t * 0.5 * PI, 0.0005);
    vec3 rd = vec3(cos(e) * sin(az), sin(e), cos(e) * cos(az));

    float bM = 21e-6 * uHaze, bMe = bM / 0.9;
    vec3 ro = vec3(0.0, Rg + 30.0, 0.0);
    float tmax = raySphere(ro, rd, Rt).y;
    const int STEPS = 40;
    float ds = tmax / float(STEPS);
    vec3 sumR = vec3(0.0), sumM = vec3(0.0);
    float odR = 0.0, odM = 0.0, odO = 0.0;
    for (int i = 0; i < STEPS; i++) {
        vec3 p = ro + rd * (float(i) + 0.5) * ds;
        float h = length(p) - Rg;
        float dR = exp(-h / 8000.0) * ds, dM = exp(-h / 1200.0) * ds;
        odR += dR; odM += dM; odO += ozone(h) * ds;
        if (raySphere(p, uSunDir, Rg).x > 0.0) continue;
        float tl = raySphere(p, uSunDir, Rt).y;
        float dsl = tl / 12.0, lR = 0.0, lM = 0.0, lO = 0.0;
        for (int j = 0; j < 12; j++) {
            float hl = length(p + uSunDir * (float(j) + 0.5) * dsl) - Rg;
            lR += exp(-hl / 8000.0) * dsl;
            lM += exp(-hl / 1200.0) * dsl;
            lO += ozone(hl) * dsl;
        }
        vec3 att = exp(-(bR * (odR + lR) + bMe * (odM + lM) + bO * (odO + lO)));
        sumR += att * dR;
        sumM += att * dM;
    }
    float mu = dot(rd, uSunDir);
    float pR = 3.0 / (16.0 * PI) * (1.0 + mu * mu);
    const float g = 0.76;
    float pM = 3.0 / (8.0 * PI) * ((1.0 - g * g) * (1.0 + mu * mu)) / ((2.0 + g * g) * pow(1.0 + g * g - 2.0 * g * mu, 1.5));
    o = vec4(uSunI * (sumR * bR * pR + sumM * bM * pM), 1.0);
}`;

const SKY_FS = COMMON + SKY_COMMON + `
in vec2 vUv;
uniform mat4 uInvViewProj;
uniform vec3 uSunDir, uSunDisk, uMoonDir, uMoonDisk;
uniform float uSunCos;
out vec4 o;
vec3 hash3(vec3 p) {
    p = fract(p * vec3(443.897, 441.423, 437.195));
    p += dot(p, p.yxz + 19.19);
    return fract((p.xxy + p.yxx) * p.zyx);
}
void main() {
    vec4 a = uInvViewProj * vec4(vUv * 2.0 - 1.0, -1.0, 1.0);
    vec4 b = uInvViewProj * vec4(vUv * 2.0 - 1.0, 1.0, 1.0);
    vec3 d = normalize(b.xyz / b.w - a.xyz / a.w);
    vec3 c = skyLookup(normalize(vec3(d.x, max(d.y, 0.0), d.z)), 0.0);
    if (d.y < 0.0) c = mix(c, c * 0.25, smoothstep(0.0, -0.05, d.y));   // reads as distant water
    float mu = dot(d, uSunDir);
    if (mu > uSunCos && d.y > -0.01) {
        float r = sqrt(max(0.0, 1.0 - (1.0 - mu) / (1.0 - uSunCos)));
        c += uSunDisk * (0.4 + 0.6 * r);    // limb darkening
    }
    float mm = dot(d, uMoonDir);
    if (mm > 0.99997 && d.y > -0.01) {
        vec3 q = normalize(d - uMoonDir * mm);
        float maria = 0.8 + 0.2 * sin(q.x * 9000.0 + q.y * 7000.0) * sin(q.z * 8000.0);
        c += uMoonDisk * maria;
    }
    // Stars: fixed radiance, so exposure alone decides when they show
    if (d.y > 0.0) {
        vec3 p = d * 260.0;
        vec3 cell = floor(p);
        vec3 h = hash3(cell);
        vec3 sp = cell + 0.25 + 0.5 * h;
        float star = smoothstep(0.1, 0.0, length(p - sp)) * step(0.982, h.x);
        c += star * mix(vec3(0.8, 0.85, 1.0), vec3(1.0, 0.85, 0.7), h.y) * 0.03 * (0.05 + pow(h.z, 3.0)) * smoothstep(0.0, 0.2, d.y);
    }
    o = vec4(c, 1.0);
}`;

// ---- Shared displacement sampling (ocean vertices + probes) ------------
const WIND_CHUNK = `
uniform vec2 uWind;            // unit wind direction (world xz)
uniform vec3 uL;               // cascade sizes
uniform vec3 uWake;            // dynamic cascade: centre x, z and size
uniform float uWakeOn;
vec2 toWind(vec2 p) { return vec2(dot(p, uWind), dot(p, vec2(-uWind.y, uWind.x))); }
vec2 fromWind(vec2 s) { return uWind * s.x + vec2(-uWind.y, uWind.x) * s.y; }
vec2 wakeUV(vec2 xz) { return (xz - uWake.xy) / uWake.z + 0.5 + 0.5 / float(N); }
float wakeMask(vec2 uv) { vec2 e = abs(uv - 0.5); return uWakeOn * (1.0 - smoothstep(0.30, 0.42, max(e.x, e.y))); }
`;

const DISP_CHUNK = WIND_CHUNK + `
uniform sampler2D uDisp0, uDisp1, uDisp2, uWakeDisp;
vec3 cascadeDisp(sampler2D t, vec2 w, float L, float footprint) {
    float lod = log2(max(footprint / (L / float(N)), 1.0));
    float fade = 1.0 - smoothstep(L * 0.03, L * 0.12, footprint);
    vec3 d = textureLod(t, w / L, lod).xyz * fade;
    vec2 h = fromWind(d.xz);
    return vec3(h.x, d.y, h.y);
}
vec3 oceanDisp(vec2 xz, float footprint, float withWake) {
    vec2 w = toWind(xz);
    vec3 d = cascadeDisp(uDisp0, w, uL.x, footprint)
           + cascadeDisp(uDisp1, w, uL.y, footprint)
           + cascadeDisp(uDisp2, w, uL.z, footprint);
    vec2 uv = wakeUV(xz);
    float m = wakeMask(uv) * withWake;
    if (m > 0.0) d += textureLod(uWakeDisp, uv, log2(max(footprint / (uWake.z / float(N)), 1.0))).xyz * m;
    return d;
}
`;

// ---- Ocean surface: projected grid (Johanson 2004) ----------------------
const OCEAN_VS = COMMON + DISP_CHUNK + `
in vec2 aGrid;
uniform mat4 uViewProj, uInvViewProj;
uniform vec3 uCamPos;
uniform vec4 uNdc;             // xmin, xmax, ymin, ymax
uniform float uVertexAngle, uFar;
out vec3 vWorld;
out vec2 vXZ;

void main() {
    vec2 ndc = mix(uNdc.xz, uNdc.yw, aGrid);
    vec4 a = uInvViewProj * vec4(ndc, -1.0, 1.0);
    vec4 b = uInvViewProj * vec4(ndc, 1.0, 1.0);
    vec3 dir = normalize(b.xyz / b.w - a.xyz / a.w);
    vec2 xz;
    if (dir.y < -1e-4) {
        float t = min(-uCamPos.y / dir.y, uFar);
        xz = uCamPos.xz + dir.xz * t;
    } else {
        xz = uCamPos.xz + normalize(dir.xz + 1e-6) * uFar;
    }
    float dist = length(xz - uCamPos.xz);
    vec3 d = oceanDisp(xz, max(dist, 1.0) * uVertexAngle, 1.0);
    d *= 1.0 - smoothstep(uFar * 0.5, uFar, dist);
    vWorld = vec3(xz.x, 0.0, xz.y) + d;
    vXZ = xz;
    gl_Position = uViewProj * vec4(vWorld, 1.0);
}`;

const OCEAN_FS = COMMON + SKY_COMMON + WIND_CHUNK + `
in vec3 vWorld;
in vec2 vXZ;
uniform vec3 uCamPos, uSunDir, uSunE, uMoonDir, uMoonE;
uniform float uBio;
uniform vec2 uUnresolved;
uniform vec3 uBetaExt;
uniform float uFilter, uFoamOn, uDebug, uHs, uDepth;
uniform sampler2D uSlope0, uSlope1, uSlope2, uFoam0, uFoam1, uWakeSlope, uWakeFoam, uWakeHeight;
uniform float uWakeViz;
uniform sampler2D uRefl;
uniform vec2 uRes;
out vec4 o;

float erfc_(float x) { return 2.0 * exp(-x * x) / (2.319 * x + sqrt(4.0 + 1.52 * x * x)); }
float Lambda(float cosTheta, float sigmaSq) {
    float v = cosTheta / sqrt((1.0 - cosTheta * cosTheta) * (2.0 * sigmaSq));
    return max(0.0, (exp(-v * v) - v * sqrt(PI) * erfc_(v)) / (2.0 * v * sqrt(PI)));
}
// Anisotropic Gaussian-slope BRDF for the sun (Bruneton et al. 2010)
float reflectedSun(vec3 L, vec3 V, vec3 N, vec3 Tx, vec3 Ty, vec2 sig) {
    vec3 H = normalize(L + V);
    float zL = dot(L, N), zV = dot(V, N), zH = dot(H, N);
    if (zL <= 0.0) return 0.0;
    float zetax = dot(H, Tx) / zH, zetay = dot(H, Ty) / zH;
    float p = exp(-0.5 * (zetax * zetax / sig.x + zetay * zetay / sig.y)) / (2.0 * PI * sqrt(sig.x * sig.y));
    float vx = dot(V, Tx), vy = dot(V, Ty), lx = dot(L, Tx), ly = dot(L, Ty);
    float cv = vx * vx / max(vx * vx + vy * vy, 1e-6), cl = lx * lx / max(lx * lx + ly * ly, 1e-6);
    float sV = sig.x * cv + sig.y * (1.0 - cv), sL = sig.x * cl + sig.y * (1.0 - cl);
    float F = 0.02 + 0.98 * pow(1.0 - clamp(dot(V, H), 0.0, 1.0), 5.0);
    zL = max(zL, 0.01); zV = max(zV, 0.01);
    return F * p / ((1.0 + Lambda(zL, sL) + Lambda(zV, sV)) * zV * zH * zH * zH * zH * 4.0);
}
float meanFresnel(float cosV, float sigmaV) {
    return 0.02 + 0.98 * pow(1.0 - cosV, 5.0 * exp(-2.69 * sigmaV)) / (1.0 + 22.7 * pow(sigmaV, 1.5));
}

float hash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float vnoise(vec2 p) {
    vec2 i = floor(p), f = fract(p);
    f = f * f * (3.0 - 2.0 * f);
    return mix(mix(hash(i), hash(i + vec2(1, 0)), f.x), mix(hash(i + vec2(0, 1)), hash(i + vec2(1, 1)), f.x), f.y);
}
float fbm(vec2 p) {
    float s = 0.0, a = 0.5;
    for (int i = 0; i < 4; i++) { s += a * vnoise(p); p = p * 2.07 + vec2(1.7, 9.2); a *= 0.5; }
    return s / 0.9375;
}

void main() {
    vec2 w = toWind(vXZ);
    vec4 s0 = texture(uSlope0, w / uL.x);
    vec4 s1 = texture(uSlope1, w / uL.y);
    vec4 s2 = texture(uSlope2, w / uL.z);
    vec2 mean = s0.xy + s1.xy + s2.xy;
    vec2 var = max(s0.zw - s0.xy * s0.xy, 0.0) + max(s1.zw - s1.xy * s1.xy, 0.0) + max(s2.zw - s2.xy * s2.xy, 0.0);

    // Dynamic cascade (world-aligned) joins the same slope statistics
    vec2 wuv = wakeUV(vXZ);
    float wm = wakeMask(wuv);
    vec2 wakeFoam = vec2(0.0);
    if (wm > 0.0) {
        vec4 sw = texture(uWakeSlope, wuv) * wm;
        mean += toWind(sw.xy);
        vec2 wv = max(sw.zw - sw.xy * sw.xy * wm, 0.0);
        vec2 c2 = uWind * uWind;
        var += vec2(c2.x * wv.x + c2.y * wv.y, c2.y * wv.x + c2.x * wv.y);
        wakeFoam = texture(uWakeFoam, wuv).rg * wm;
    }

    // Naive mode: classic fixed roughness, ignoring sub-pixel slope statistics
    var = uFilter > 0.5 ? var + uUnresolved : vec2(0.0015);

    vec2 sw = fromWind(mean);
    vec3 N = normalize(vec3(-sw.x, 1.0, -sw.y));
    vec3 V = normalize(uCamPos - vWorld);
    float nv = dot(N, V);
    if (nv < 0.02) N = normalize(N + (0.02 - nv) * V);
    vec3 L = uSunDir;

    vec3 Tu = vec3(uWind.x, 0.0, uWind.y), Tc = vec3(-uWind.y, 0.0, uWind.x);
    vec3 Tx = normalize(Tu - N * dot(N, Tu));
    vec3 Ty = normalize(Tc - N * dot(N, Tc) - Tx * dot(Tx, Tc));

    float sigma = sqrt(var.x + var.y);
    float F = meanFresnel(clamp(dot(V, N), 0.0, 1.0), sigma);

    // Sky reflection, pre-filtered by the slope variance
    vec3 R = reflect(-V, N);
    R.y = abs(R.y);
    float lod = clamp(log2(2.0 * sigma / (2.0 * PI / ${SKY_W}.0)), 0.0, 7.0);
    vec3 skyR = skyLookup(normalize(R), lod);
    // Planar reflection of the boat, rippled by the filtered surface normal
    float dCam = length(uCamPos - vWorld);
    vec2 ruv = gl_FragCoord.xy / uRes + N.xz * 0.35 / (1.0 + dCam * 0.04);
    vec4 refl = texture(uRefl, ruv);
    skyR = mix(skyR, refl.rgb, refl.a * (1.0 - smoothstep(0.08, 0.3, sigma)));

    vec3 sun = uSunE * reflectedSun(L, V, N, Tx, Ty, var) + uMoonE * reflectedSun(uMoonDir, V, N, Tx, Ty, var);

    // Light from below the surface + forward scattering through thin crests
    vec3 skyAmb = textureLod(uSky, vec2(0.5, 0.85), 9.0).rgb * PI;
    vec3 seaColor = vec3(0.004, 0.026, 0.06);
    vec3 Ein = skyAmb + uSunE * max(L.y, 0.0);
    vec3 up = seaColor * Ein / PI;
    // Shallow water: light reaches a sandy bed and returns, attenuated per
    // channel (red first), giving the turquoise of shallow bays.
    vec3 sigmaW = vec3(0.42, 0.075, 0.045);
    vec3 T2 = exp(-sigmaW * max(uDepth - vWorld.y, 0.3) * 2.2);
    vec3 sand = vec3(0.62, 0.55, 0.40);
    up = up * (1.0 - T2) + sand * Ein / PI * T2 * 0.9;
    float crest = clamp(vWorld.y / max(uHs * 0.5, 0.05), 0.0, 1.5);
    float back = pow(clamp(dot(L, -V), 0.0, 1.0), 4.0) * pow(clamp(0.5 - 0.5 * dot(L, N), 0.0, 1.0), 3.0);
    vec3 scatter = vec3(0.02, 0.16, 0.19) * uSunE * (crest * crest * back * 0.9 + 0.006 * pow(clamp(dot(V, N), 0.0, 1.0), 2.0) * crest);

    vec3 col = F * skyR + sun + (1.0 - F) * (up + scatter);

    // Whitecaps: stage A (breaking now) and stage B (decaying streaks)
    if (uFoamOn > 0.5) {
        vec2 f0 = texture(uFoam0, w / uL.x).rg, f1 = texture(uFoam1, w / uL.y).rg * 0.7;
        float breaking = f0.g + f1.g + wakeFoam.g;
        float residual = f0.r + f1.r + wakeFoam.r * 0.75;

        // Footprint-aware detail: patterns fade to their mean when sub-pixel
        float footprint = length(fwidth(vXZ));
        float detail = 1.0 - smoothstep(0.3, 1.5, footprint);
        vec2 q = w * vec2(0.6, 1.0);   // streaks stretched along the wind
        vec2 warp = vec2(fbm(q * 0.35), fbm(q * 0.35 + 5.2)) * 3.0;
        float r1 = abs(fbm(q * 0.9 + warp) - 0.5) * 2.0;
        float r2 = abs(fbm(q * 2.3 + warp * 1.7 + 3.3) - 0.5) * 2.0;
        float lace = min(r1, r2 * 1.3);
        // Stage-B foam stays streaky however much has accumulated
        float laceMask = mix(0.3, 1.0 - smoothstep(0.0, 0.05 + min(residual, 1.0) * 0.13, lace), detail);
        float covRes = clamp(residual, 0.0, 1.0) * laceMask;

        float n = mix(0.5, fbm(vXZ * 1.3), detail);
        float covAct = smoothstep(0.3, 0.85, breaking * 1.3 + (n - 0.5) * 0.8);
        float cov = max(covAct, covRes * 0.85);

        vec3 foamC = vec3(0.8) * (0.85 + 0.3 * (n - 0.5)) * (uSunE * max(dot(N, L), 0.0) + skyAmb) / PI;
        col = mix(col, foamC, cov);

        // Bioluminescence: dinoflagellates flash where the water is churned
        // (wake breaking, stern wash, steep wake slopes, breaking crests)
        if (uBio > 0.0) {
            float stir = wakeFoam.g * 1.6 + wakeFoam.r * 0.7 + (f0.g + f1.g) * 0.25;
            stir += clamp(length(mean - (s0.xy + s1.xy + s2.xy)) * 6.0 - 0.15, 0.0, 1.0) * wm;
            float sparkle = mix(1.0, 0.5 + fbm(vXZ * 4.0 + uHs) * 1.2, detail);
            col += vec3(0.05, 0.75, 1.0) * 0.009 * stir * sparkle * uBio;
        }
    }

    // Wake physics view: false-colour height of the simulated cascade only
    if (uWakeViz > 0.5) {
        float h = textureLod(uWakeHeight, wuv, 0.0).y;
        float t = sign(h) * sqrt(min(abs(h) / 0.3, 1.0));      // perceptual: faint long waves stay visible
        vec3 vz = t > 0.0 ? mix(vec3(0.5), vec3(0.95, 0.2, 0.12), t) : mix(vec3(0.5), vec3(0.12, 0.35, 0.95), -t);
        float ref = dot(skyAmb + uSunE * max(L.y, 0.0) + uMoonE * max(uMoonDir.y, 0.0), vec3(0.3, 0.5, 0.2)) * 0.12;
        col = mix(col, vz * ref, 0.9 * wm / max(uWakeOn, 1e-3));
    }

    if (uDebug > 0.5) {
        col *= mix(vec3(1.0), vec3(1.0, 0.45, 0.4), clamp(dot(s0.zw, vec2(40.0)), 0.0, 1.0) * 0.6);
        col *= mix(vec3(1.0), vec3(0.4, 1.0, 0.5), clamp(dot(s1.zw, vec2(25.0)), 0.0, 1.0) * 0.6);
        col *= mix(vec3(1.0), vec3(0.45, 0.55, 1.0), clamp(dot(s2.zw, vec2(8.0)), 0.0, 1.0) * 0.6);
        col = mix(col, col * vec3(1.6, 1.3, 0.4), wm * 0.5);
    }

    // Aerial perspective
    float d = length(uCamPos - vWorld);
    vec3 T = exp(-uBetaExt * d);
    vec3 vd = normalize(vWorld - uCamPos);
    vec3 fog = skyLookup(normalize(vec3(vd.x, 0.002, vd.z)), 1.0);
    o = vec4(col * T + fog * (1.0 - T), 1.0);
}`;

// ---- Probes: water height + slope at arbitrary world points -----------
// Choppy waves move the surface sideways, so the water above point x came
// from some x0 with x0 + D(x0) = x; a few fixed-point steps invert this.
const PROBE_FS = COMMON + DISP_CHUNK + `
uniform vec4 uProbe[${PROBES}];   // x, z, footprint (filter size), include wake
out vec4 o;
void main() {
    vec4 pr = uProbe[int(gl_FragCoord.x)];
    vec2 x0 = pr.xy;
    for (int i = 0; i < 4; i++) x0 = pr.xy - oceanDisp(x0, pr.z, pr.w).xz;
    float h = oceanDisp(x0, pr.z, pr.w).y;
    o = vec4(h, x0 - pr.xy, 1.0);
}`;

// ---- Boat -------------------------------------------------------------
const BOAT_VS = `#version 300 es
precision highp float;
in vec3 aPos;
in vec3 aNormal;
in vec3 aColor;
uniform mat4 uViewProj, uModel;
out vec3 vWorld, vNormal, vColor;
void main() {
    vec4 w = uModel * vec4(aPos, 1.0);
    vWorld = w.xyz;
    vNormal = mat3(uModel) * aNormal;
    vColor = aColor;
    gl_Position = uViewProj * w;
}`;

const BOAT_FS = COMMON + SKY_COMMON + `
in vec3 vWorld, vNormal, vColor;
uniform vec3 uCamPos, uSunDir, uSunE, uBetaExt, uMoonDir, uMoonE;
uniform float uClipY;          // reflection pass: drop what was under the water
out vec4 o;
void main() {
    if (vWorld.y > uClipY) discard;
    vec3 N = normalize(vNormal);
    vec3 V = normalize(uCamPos - vWorld);
    if (dot(N, V) < 0.0) N = -N;
    vec3 L = uSunDir;
    float sum = vColor.r + vColor.g + vColor.b;
    float gloss = sum < 0.1 ? 0.97 : (sum < 0.25 ? 0.85 : 0.55);   // glass, gelcoat, paint
    // Sky irradiance from a heavily filtered lookup in the normal direction
    vec3 nUp = normalize(vec3(N.x, max(N.y, 0.05), N.z));
    vec3 skyIrr = skyLookup(nUp, 6.0) * PI * (0.6 + 0.4 * N.y);
    vec3 seaBounce = vec3(0.001, 0.002, 0.003) * max(-N.y, 0.0);
    vec3 diff = vColor * (uSunE * max(dot(N, L), 0.0) + uMoonE * max(dot(N, uMoonDir), 0.0) + skyIrr + seaBounce * 20.0 * (uSunE.g + uMoonE.g)) / PI;
    vec3 H = normalize(L + V);
    float shin = mix(40.0, 900.0, gloss);
    float F = 0.04 + 0.96 * pow(1.0 - max(dot(V, N), 0.0), 5.0);
    vec3 spec = uSunE * F * pow(max(dot(N, H), 0.0), shin) * (shin + 8.0) / (8.0 * PI) * max(dot(N, L), 0.0);
    vec3 refl = skyLookup(normalize(reflect(-V, N) * vec3(1.0, 1.0, 1.0) + vec3(0.0, 0.02, 0.0)), mix(5.0, 1.0, gloss)) * F * gloss;
    vec3 col = diff + spec + refl;
    float d = length(uCamPos - vWorld);
    vec3 T = exp(-uBetaExt * d);
    vec3 vd = normalize(vWorld - uCamPos);
    o = vec4(col * T + skyLookup(normalize(vec3(vd.x, 0.002, vd.z)), 1.0) * (1.0 - T), 1.0);
}`;

// ---- Bow spray: stateless GPU particles ---------------------------------
// Each particle is a pure function of (id, time): it is re-born every
// lifetime at a point on the bow flare, launched sideways and up, and falls
// ballistically. The emitter is moved back along the track by speed·age so
// spray already in the air stays where it was thrown.
const SPRAY_VS = `#version 300 es
precision highp float;
in float aId;
uniform mat4 uViewProj;
uniform vec3 uCamPos;
uniform vec2 uBoatXZ, uDir;
uniform float uTime, uSpeed, uWaterY, uLen, uBeam, uPx;
out float vAlpha;
out float vShade;
float h1(float n) { return fract(sin(n * 12.9898 + 78.233) * 43758.5453); }
void main() {
    float life = 0.45 + 0.6 * h1(aId * 1.31);
    float t = uTime + h1(aId * 7.13) * life;
    float cyc = floor(t / life);
    float age = t - cyc * life;
    float s = aId * 13.7 + cyc * 1.618;
    float side = h1(s) < 0.5 ? -1.0 : 1.0;
    vec2 perp = vec2(uDir.y, -uDir.x);
    float a = mix(0.18, 0.42, pow(h1(s + 1.0), 0.7)) * uLen;     // forward third: where the bow wave climbs
    float u = clamp(a / (0.5 * uLen), 0.0, 1.0);
    float hb = 0.5 * uBeam * pow(max(1.0 - u * u, 0.0), 0.6);
    float k = clamp((uSpeed - 1.5) / 6.0, 0.0, 1.6);
    vec2 e = uBoatXZ + uDir * (a - uSpeed * age) + perp * side * (hb + 0.1);
    vec2 vh = perp * side * (2.5 + 4.5 * h1(s + 2.0)) * k + uDir * uSpeed * 0.25;
    float vy = (0.8 + 2.4 * h1(s + 3.0)) * k * (0.5 + 0.8 * u);
    vec3 pos = vec3(e.x + vh.x * age, uWaterY + 0.15 + vy * age - 4.9 * age * age, e.y + vh.y * age);
    float fade = pow(1.0 - age / life, 1.5) * smoothstep(0.0, 0.08, age);
    vAlpha = fade * clamp(k * 1.5, 0.0, 1.0) * step(uWaterY - 0.2, pos.y);
    vShade = h1(s + 5.0);
    gl_Position = uViewProj * vec4(pos, 1.0);
    float dist = length(pos - uCamPos);
    gl_PointSize = clamp((0.03 + 0.07 * h1(s + 4.0)) * (1.0 + 0.8 * age) * uPx / max(dist, 0.5), 1.0, 24.0);
}`;

const SPRAY_FS = COMMON + SKY_COMMON + `
in float vAlpha;
in float vShade;
uniform vec3 uSunE, uSunDir, uMoonE, uCamPos;
uniform vec3 uViewDir;
out vec4 o;
void main() {
    vec2 q = gl_PointCoord * 2.0 - 1.0;
    float r2 = dot(q, q);
    if (r2 > 1.0 || vAlpha <= 0.0) discard;
    float a = vAlpha * (1.0 - r2 * r2) * 0.85;
    vec3 amb = textureLod(uSky, vec2(0.5, 0.85), 9.0).rgb * PI;
    // droplets scatter strongly forward: glow when looking toward the light
    float fwd = pow(max(dot(uViewDir, uSunDir), 0.0), 6.0);
    vec3 c = 0.85 * (amb + uSunE * (0.35 + 2.5 * fwd) + uMoonE * 0.5) / PI * (0.85 + 0.3 * vShade);
    o = vec4(c * a, a);                       // premultiplied
}`;

// ---- Post: bloom (Jimenez, "Next Generation Post Processing in Call of Duty", SIGGRAPH 2014) ----
const DOWN_FS = COMMON + `
in vec2 vUv;
uniform sampler2D uSrc;
uniform vec2 uTexel;
uniform float uKaris;
out vec4 o;
vec3 s(vec2 off) { return texture(uSrc, vUv + off * uTexel).rgb; }
float w(vec3 c) { return uKaris > 0.5 ? 1.0 / (1.0 + dot(c, vec3(0.2126, 0.7152, 0.0722))) : 1.0; }
void main() {
    vec3 a = s(vec2(-2, 2)), b = s(vec2(0, 2)), c = s(vec2(2, 2));
    vec3 d = s(vec2(-2, 0)), e = s(vec2(0, 0)), f = s(vec2(2, 0));
    vec3 g = s(vec2(-2, -2)), h = s(vec2(0, -2)), i = s(vec2(2, -2));
    vec3 j = s(vec2(-1, 1)), k = s(vec2(1, 1)), l = s(vec2(-1, -1)), m = s(vec2(1, -1));
    vec3 g0 = (j + k + l + m) * 0.25, g1 = (a + b + d + e) * 0.25, g2 = (b + c + e + f) * 0.25;
    vec3 g3 = (d + e + g + h) * 0.25, g4 = (e + f + h + i) * 0.25;
    float w0 = w(g0) * 0.5, w1 = w(g1) * 0.125, w2 = w(g2) * 0.125, w3 = w(g3) * 0.125, w4 = w(g4) * 0.125;
    vec3 r = (g0 * w0 + g1 * w1 + g2 * w2 + g3 * w3 + g4 * w4) / (w0 + w1 + w2 + w3 + w4);
    o = vec4(min(r, vec3(2000.0)), 1.0);
}`;

const UP_FS = COMMON + `
in vec2 vUv;
uniform sampler2D uSrc;
uniform vec2 uTexel;
out vec4 o;
void main() {
    vec3 c = vec3(0.0);
    c += texture(uSrc, vUv + uTexel * vec2(-1, 1)).rgb + texture(uSrc, vUv + uTexel * vec2(1, 1)).rgb;
    c += texture(uSrc, vUv + uTexel * vec2(-1, -1)).rgb + texture(uSrc, vUv + uTexel * vec2(1, -1)).rgb;
    c += 2.0 * (texture(uSrc, vUv + uTexel * vec2(0, 1)).rgb + texture(uSrc, vUv + uTexel * vec2(0, -1)).rgb);
    c += 2.0 * (texture(uSrc, vUv + uTexel * vec2(1, 0)).rgb + texture(uSrc, vUv + uTexel * vec2(-1, 0)).rgb);
    c += 4.0 * texture(uSrc, vUv).rgb;
    o = vec4(c / 16.0, 1.0);
}`;

const COMPOSITE_FS = COMMON + `
in vec2 vUv;
uniform sampler2D uHdr, uBloom;
uniform float uExposure, uBloomOn, uNight;
out vec4 o;
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + 0.03)) / (x * (2.43 * x + 0.59) + 0.14), 0.0, 1.0); }
vec3 toSRGB(vec3 c) { return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
void main() {
    vec3 c = texture(uHdr, vUv).rgb;
    if (uBloomOn > 0.5) c = mix(c, texture(uBloom, vUv).rgb, 0.05);
    c *= uExposure;
    // Scotopic (rod) vision at night: colour fades and shifts toward blue
    // (Purkinje shift; after Kirk & O'Brien, SIGGRAPH 2011)
    float rod = dot(c, vec3(0.03, 0.42, 0.55));
    c = mix(c, rod * vec3(0.62, 0.78, 1.15), uNight * 0.55);
    c = aces(c);
    vec2 q = vUv - 0.5;
    c *= 1.0 - dot(q, q) * 0.35;
    c = toSRGB(c);
    c += (fract(sin(dot(gl_FragCoord.xy, vec2(12.9898, 78.233))) * 43758.5453) - 0.5) / 255.0;
    o = vec4(c, 1.0);
}`;

// =====================================================================
//  3. GPU resources
// =====================================================================
const progs = {
    spectrum: program(FULLSCREEN_VS, SPECTRUM_FS),
    fft1: program(FULLSCREEN_VS, fftShader(1)),
    fft2: program(FULLSCREEN_VS, fftShader(2)),
    fft3: program(FULLSCREEN_VS, fftShader(3)),
    assemble: program(FULLSCREEN_VS, ASSEMBLE_FS),
    foam: program(FULLSCREEN_VS, FOAM_FS),
    wakeSource: program(FULLSCREEN_VS, WAKE_SOURCE_FS),
    wakeK: program(FULLSCREEN_VS, WAKE_K_FS),
    skyLut: program(FULLSCREEN_VS, SKY_LUT_FS),
    sky: program(FULLSCREEN_VS, SKY_FS),
    ocean: program(OCEAN_VS, OCEAN_FS),
    probe: program(FULLSCREEN_VS, PROBE_FS),
    boat: program(BOAT_VS, BOAT_FS),
    spray: program(SPRAY_VS, SPRAY_FS),
    down: program(FULLSCREEN_VS, DOWN_FS),
    up: program(FULLSCREEN_VS, UP_FS),
    composite: program(FULLSCREEN_VS, COMPOSITE_FS)
};

const f32 = { internal: gl.RGBA32F, filter: gl.NEAREST };

// Twiddle table: GPU sin/cos on unreduced angles has structured error that a
// solver which round-trips through the FFT every frame would accumulate into
// ghost copies of the waves. Computed once here in double precision.
const twiddleTex = makeTex(N, LOG2N, f32);
{
    const tw = new Float32Array(N * LOG2N * 4);
    for (let s = 0; s < LOG2N; s++) {
        const S = 2 << s;
        for (let i = 0; i < N; i++) {
            const a = 2 * Math.PI * (i % S) / S;
            tw.set([Math.cos(a), Math.sin(a), 0, 0], (s * N + i) * 4);
        }
    }
    gl.bindTexture(gl.TEXTURE_2D, twiddleTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, N, LOG2N, gl.RGBA, gl.FLOAT, tw);
}
const fftA = [makeTex(N, N, f32), makeTex(N, N, f32), makeTex(N, N, f32)];
const fftB = [makeTex(N, N, f32), makeTex(N, N, f32), makeTex(N, N, f32)];
const bufA1 = { tex: [fftA[0]], fbo: makeFBO([fftA[0]]) };
const bufB1 = { tex: [fftB[0]], fbo: makeFBO([fftB[0]]) };
const bufA2 = { tex: fftA.slice(0, 2), fbo: makeFBO(fftA.slice(0, 2)) };
const bufB2 = { tex: fftB.slice(0, 2), fbo: makeFBO(fftB.slice(0, 2)) };
const bufA3 = { tex: fftA, fbo: makeFBO(fftA) };
const bufB3 = { tex: fftB, fbo: makeFBO(fftB) };

function makeLayer(L) {
    const c = { L };
    c.disp = makeTex(N, N, { mip: true });
    c.slope = makeTex(N, N, { mip: true, aniso: true });
    c.foam = [makeTex(N, N, { mip: true, aniso: true }), makeTex(N, N, { mip: true, aniso: true })];
    c.assembleFBO = makeFBO([c.disp, c.slope]);
    c.foamFBO = [makeFBO([c.foam[0]]), makeFBO([c.foam[1]])];
    c.foamIdx = 0;
    return c;
}
const cascades = CASCADES.map(L => {
    const c = makeLayer(L);
    c.h0 = makeTex(N, N, f32);
    return c;
});
const wake = makeLayer(WAKE_L);
wake.source = makeTex(N, N, f32);
wake.sourceFBO = makeFBO([wake.source]);
for (const t of [...wake.foam, wake.disp, wake.slope]) {      // no wrap-around for the wake window
    gl.bindTexture(gl.TEXTURE_2D, t);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

const skyLut = makeTex(SKY_W, SKY_H, { mip: true, wrap: gl.CLAMP_TO_EDGE });
gl.bindTexture(gl.TEXTURE_2D, skyLut);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
const skyFBO = makeFBO([skyLut]);

const probeTex = makeTex(PROBES, 1, f32);
const probeFBO = makeFBO([probeTex]);

// ---- Ocean grid (projected grid, Johanson 2004) ----
let grid = null;
function buildGrid(cols, rows) {
    if (grid) { gl.deleteVertexArray(grid.vao); gl.deleteBuffer(grid.vbo); gl.deleteBuffer(grid.ibo); }
    const verts = new Float32Array((cols + 1) * (rows + 1) * 2);
    let k = 0;
    for (let y = 0; y <= rows; y++) for (let x = 0; x <= cols; x++) {
        verts[k++] = x / cols;
        verts[k++] = y / rows;
    }
    const idx = new Uint32Array(cols * rows * 6);
    k = 0;
    for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
        const a = y * (cols + 1) + x, b = a + 1, c = a + cols + 1, d = c + 1;
        idx[k++] = a; idx[k++] = b; idx[k++] = d;
        idx[k++] = a; idx[k++] = d; idx[k++] = c;
    }
    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const vbo = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
    gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(progs.ocean.p, 'aGrid');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const ibo = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ibo);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    grid = { vao, vbo, ibo, count: idx.length, cols, rows };
}

const QUALITY = {

// =====================================================================
//  4. Boat: procedural hull, deck and cabin
// =====================================================================
const BOAT = { length: 12, beam: 3.6, draft: 0.55 };

function buildBoatMesh() {
    const pos = [], col = [], nrm = [], idx = [];
    const L = BOAT.length, B = BOAT.beam;
    const white = [0.82, 0.83, 0.84], navy = [0.025, 0.045, 0.11], red = [0.32, 0.06, 0.05];
    const teak = [0.42, 0.27, 0.15], glass = [0.02, 0.03, 0.04], grey = [0.55, 0.56, 0.58], deck = [0.66, 0.66, 0.63];

    function hullFrame(t) {
        const x = -L / 2 + t * L;
        let hb = B / 2 * (0.93 + 0.07 * Math.min(1, t * 6));
        if (t > 0.45) { const u = (t - 0.45) / 0.55; hb *= Math.pow(Math.max(0, 1 - u * u), 0.62); }
        const sheer = 1.15 + 0.5 * Math.pow(t, 2.6);
        const bow = Math.max(0, (t - 0.55) / 0.45);
        const keel = 0.68 * (1 - 0.9 * Math.pow(bow, 1.5)) * (t < 0.05 ? 0.85 + t * 3 : 1);
        const chine = 0.14 + 0.75 * Math.pow(bow, 2);
        return { x, hb, sheer, keel, chine };
    }
    // Deep-V section: flared topsides down to a chine, then a straight V to the keel
    function section(f, u) {           // u in [0,1]: deck edge -> keel
        if (u < 0.42) {
            const a = u / 0.42;
            return [f.hb * (1 - 0.07 * a * a), f.sheer + (f.chine - f.sheer) * a];
        }
        const a = (u - 0.42) / 0.58;
        return [f.hb * 0.93 * (1 - a), f.chine - (f.keel + f.chine) * a * (1.08 - 0.08 * a)];
    }

    // Hull skin: stations x ring (port deck edge -> keel -> starboard deck edge)
    const S = 56, R = 24;
    const base = pos.length / 3;
    for (let i = 0; i <= S; i++) {
        const f = hullFrame(i / S);
        for (let j = 0; j <= R; j++) {
            const side = j <= R / 2 ? 1 : -1;
            const u = j <= R / 2 ? j / (R / 2) : (R - j) / (R / 2);
            const [z, y] = section(f, u);
            pos.push(f.x, y, side * z);
            const c = y < 0.02 ? red : (y < 0.16 ? white : navy);
            col.push(...c);
        }
    }
    for (let i = 0; i < S; i++) for (let j = 0; j < R; j++) {
        const a = base + i * (R + 1) + j, b = a + R + 1;
        idx.push(a, b, a + 1, a + 1, b, b + 1);
    }
    // Transom (stern plate): fan from its centre
    const tc = pos.length / 3;
    const f0 = hullFrame(0);
    pos.push(f0.x, (f0.sheer - f0.keel) * 0.5, 0); col.push(...white);
    for (let j = 0; j < R; j++) idx.push(tc, base + j + 1, base + j);

    // Deck: flat strip between the two deck edges at each station
    const deckBase = pos.length / 3;
    for (let i = 0; i <= S; i++) {
        const f = hullFrame(i / S);
        pos.push(f.x, f.sheer, f.hb, f.x, f.sheer, -f.hb);
        col.push(...deck, ...deck);
    }
    for (let i = 0; i < S; i++) {
        const a = deckBase + i * 2;
        idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }

    function quad(p0, p1, p2, p3, c) {
        const s0 = pos.length / 3;
        pos.push(...p0, ...p1, ...p2, ...p3);
        col.push(...c, ...c, ...c, ...c);
        idx.push(s0, s0 + 1, s0 + 2, s0, s0 + 2, s0 + 3);
    }
    function poly(pts, c) {            // convex polygon as a fan
        const s0 = pos.length / 3;
        for (const p of pts) { pos.push(...p); col.push(...c); }
        for (let i = 1; i < pts.length - 1; i++) idx.push(s0, s0 + i, s0 + i + 1);
    }

    // Cabin: a swept side profile extruded across the beam, narrowing forward
    const deckY = hullFrame(0.45).sheer;
    const prof = [[-3.0, 0], [1.9, 0], [1.75, 0.42], [0.55, 0.98], [-2.55, 0.98], [-3.0, 0.9]];
    const glassEdge = 2;                                   // edge 2 -> 3 is the windshield
    const halfW = x => B * 0.34 * (1 - 0.28 * Math.max(0, (x + 0.5) / 2.4));
    for (let k = 0; k < prof.length; k++) {
        const [xa, ya] = prof[k], [xb, yb] = prof[(k + 1) % prof.length];
        if (ya === 0 && yb === 0) continue;               // bottom sits on the deck
        const c = k === glassEdge ? glass : white;
        quad([xa, deckY + ya, halfW(xa)], [xb, deckY + yb, halfW(xb)], [xb, deckY + yb, -halfW(xb)], [xa, deckY + ya, -halfW(xa)], c);
    }
    for (const sd of [1, -1]) {
        const pts = prof.map(([x, y]) => [x, deckY + y, sd * halfW(x)]);
        poly(sd > 0 ? pts : pts.slice().reverse(), white);
        // dark window band, slightly proud of the side
        const wy0 = deckY + 0.5, wy1 = deckY + 0.86, wx0 = -2.5, wx1 = 1.0;
        const z0 = sd * (halfW(wx0) + 0.01), z1 = sd * (halfW(wx1) + 0.01);
        quad([wx0, wy0, z0], [wx1, wy0, z1], [wx1 - 0.25, wy1, z1], [wx0 + 0.1, wy1, z0], glass);
    }
    // Aft cabin wall: glazed door and side windows
    {
        const x = -3.0 - 0.01;
        quad([x, deckY + 0.08, 0.42], [x, deckY + 0.08, -0.42], [x, deckY + 0.82, -0.42], [x, deckY + 0.82, 0.42], glass);
        quad([x, deckY + 0.45, 1.0], [x, deckY + 0.45, 0.6], [x, deckY + 0.82, 0.6], [x, deckY + 0.82, 1.0], glass);
        quad([x, deckY + 0.45, -0.6], [x, deckY + 0.45, -1.0], [x, deckY + 0.82, -1.0], [x, deckY + 0.82, -0.6], glass);
    }
    // Cockpit coamings: low walls around the aft deck
    for (const sd of [1, -1]) {
        const fa = hullFrame(0.02), fb = hullFrame(0.25);
        const za = sd * (fa.hb - 0.12), zb = sd * (fb.hb - 0.12);
        quad([fa.x, fa.sheer, za], [fb.x, fb.sheer, zb], [fb.x, fb.sheer + 0.32, zb], [fa.x, fa.sheer + 0.32, za], white);
        quad([fa.x, fa.sheer + 0.32, za], [fb.x, fb.sheer + 0.32, zb], [fb.x, fb.sheer + 0.32, zb + sd * 0.12], [fa.x, fa.sheer + 0.32, za + sd * 0.12], teak);
    }
    {
        const f = hullFrame(0.02);
        quad([f.x, f.sheer, f.hb - 0.12], [f.x, f.sheer, -(f.hb - 0.12)], [f.x, f.sheer + 0.32, -(f.hb - 0.12)], [f.x, f.sheer + 0.32, f.hb - 0.12], white);
    }
    // Hardtop overhang and a short mast
    quad([-3.15, deckY + 1.0, B * 0.36], [0.7, deckY + 1.0, B * 0.27], [0.7, deckY + 1.0, -B * 0.27], [-3.15, deckY + 1.0, -B * 0.36], white);
    quad([-2.2, deckY + 1.0, 0.04], [-2.0, deckY + 1.0, 0.04], [-2.05, deckY + 1.75, 0.04], [-2.15, deckY + 1.75, 0.04], grey);
    quad([-2.2, deckY + 1.0, -0.04], [-2.0, deckY + 1.0, -0.04], [-2.05, deckY + 1.75, -0.04], [-2.15, deckY + 1.75, -0.04], grey);

    // Teak swim platform behind the transom
    const tf = hullFrame(0);
    const py = 0.32, pw = tf.hb * 0.92, px0 = tf.x - 0.75, px1 = tf.x + 0.02;
    quad([px0, py, pw], [px1, py, pw], [px1, py, -pw], [px0, py, -pw], teak);
    quad([px0, py - 0.08, pw], [px0, py, pw], [px0, py, -pw], [px0, py - 0.08, -pw], teak);

    // Bow rails: thin bars along the foredeck edges, with stanchions
    for (const sd of [1, -1]) {
        for (let i = 32; i < S - 2; i++) {
            const fa = hullFrame(i / S), fb = hullFrame((i + 1) / S);
            const za = sd * (fa.hb - 0.1), zb = sd * (fb.hb - 0.1);
            const ya = fa.sheer + 0.6, yb = fb.sheer + 0.6;
            quad([fa.x, ya, za], [fb.x, yb, zb], [fb.x, yb + 0.04, zb], [fa.x, ya + 0.04, za], grey);
            if (i % 6 === 2) quad([fa.x, fa.sheer, za], [fa.x + 0.05, fa.sheer, za], [fa.x + 0.05, ya, za], [fa.x, ya, za], grey);
        }
    }

    // Normals: area-weighted, smooth on the hull, flat elsewhere (unshared verts)
    const n = new Float32Array(pos.length);
    for (let i = 0; i < idx.length; i += 3) {
        const a = idx[i] * 3, b = idx[i + 1] * 3, c = idx[i + 2] * 3;
        const ux = pos[b] - pos[a], uy = pos[b + 1] - pos[a + 1], uz = pos[b + 2] - pos[a + 2];
        const vx = pos[c] - pos[a], vy = pos[c + 1] - pos[a + 1], vz = pos[c + 2] - pos[a + 2];
        const nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
        for (const v of [a, b, c]) { n[v] += nx; n[v + 1] += ny; n[v + 2] += nz; }
    }
    for (let i = 0; i < n.length; i += 3) {
        const l = Math.hypot(n[i], n[i + 1], n[i + 2]) || 1;
        nrm.push(n[i] / l, n[i + 1] / l, n[i + 2] / l);
    }

    const vao = gl.createVertexArray();
    gl.bindVertexArray(vao);
    const attrs = [['aPos', pos], ['aNormal', nrm], ['aColor', col]];
    for (const [name, data] of attrs) {
        const b = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, b);
        gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
        const loc = gl.getAttribLocation(progs.boat.p, name);
        gl.enableVertexAttribArray(loc);
        gl.vertexAttribPointer(loc, 3, gl.FLOAT, false, 0, 0);
    }
    const ib = gl.createBuffer();
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib);
    gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, new Uint32Array(idx), gl.STATIC_DRAW);
    gl.bindVertexArray(null);
    return { vao, count: idx.length };
}
const boatMesh = buildBoatMesh();

const SPRAY_COUNT = 6000;
const sprayVAO = gl.createVertexArray();
{

// Rigid-body state: kinematic in the plane, dynamic in heave / pitch / roll
const boat = {
    x: 0, z: 0, heading: 0, speed: 0,
    y: 0, vy: 0, pitch: 0, vp: 0, roll: 0, vr: 0, waterY: 0,
    rudder: 0, throttle: 0
};

function boatAxes() {
    const f = [Math.sin(boat.heading), 0, Math.cos(boat.heading)];
    const s = [-Math.cos(boat.heading), 0, Math.sin(boat.heading)];   // local +z (port)
    return { f, s };
}

function boatModel() {
    const { f, s } = boatAxes();
    const cp = Math.cos(boat.pitch), sp = Math.sin(boat.pitch), cr = Math.cos(boat.roll), sr = Math.sin(boat.roll);
    // local rotation Rz(pitch) * Rx(roll), then into the world basis [f, up, s]
    const lx = [cp, sp, 0], ly = [-sp * cr, cp * cr, sr], lz = [sp * sr, -cp * sr, cr];
    const toW = v => [f[0] * v[0] + s[0] * v[2], v[1], f[2] * v[0] + s[2] * v[2]];
    const X = toW(lx), Y = toW(ly), Z = toW(lz);
    return new Float32Array([...X, 0, ...Y, 0, ...Z, 0, boat.x, boat.y, boat.z, 1]);
}

// =====================================================================
//  5. Render targets (resized with the window)
// =====================================================================
// Dynamic resolution: watch real frame time and trade pixels for frame rate
const perf = { scale: 1, avg: 16.7, lastChange: 0, gpuMs: null };
function adaptResolution(frameMs, now) {
    perf.avg = perf.avg * 0.92 + frameMs * 0.08;
    if (!P.autoRes || now - perf.lastChange < 1500) return;
    let s = perf.scale;
    if (perf.avg > 24) s = Math.max(0.5, s * 0.85);
    else if (perf.avg < 14 && s < 1) s = Math.min(1, s * 1.1);
    if (Math.abs(s - perf.scale) > 0.01) { perf.scale = s; perf.lastChange = now; }
}

// GPU time where the browser exposes timer queries
const timerExt = gl.getExtension('EXT_disjoint_timer_query_webgl2');
const gpuQueries = [];
function gpuTimerBegin() {
    if (!timerExt) return null;
    const q = gl.createQuery();
    gl.beginQuery(timerExt.TIME_ELAPSED_EXT, q);
    return q;
}
function gpuTimerEnd(q) {
    if (!q) return;
    gl.endQuery(timerExt.TIME_ELAPSED_EXT);
    gpuQueries.push(q);
    while (gpuQueries.length) {
        const head = gpuQueries[0];
        if (!gl.getQueryParameter(head, gl.QUERY_RESULT_AVAILABLE)) break;
        const disjoint = gl.getParameter(timerExt.GPU_DISJOINT_EXT);
        const ns = gl.getQueryParameter(head, gl.QUERY_RESULT);
        if (!disjoint) perf.gpuMs = perf.gpuMs === null ? ns / 1e6 : perf.gpuMs * 0.9 + ns / 1e6 * 0.1;
        gl.deleteQuery(head);
        gpuQueries.shift();
    }
}

let targets = null;
function resize(force) {
    const q = QUALITY[P.quality];
    const dpr = Math.min(window.devicePixelRatio || 1, q.maxDpr) * q.scale * (P.autoRes ? perf.scale : 1);
    const w = Math.max(2, Math.floor(canvas.clientWidth * dpr));
    const h = Math.max(2, Math.floor(canvas.clientHeight * dpr));
    if (targets && !force && targets.w === w && targets.h === h) return;
    canvas.width = w; canvas.height = h;

    if (targets) {
        gl.deleteRenderbuffer(targets.msColor); gl.deleteRenderbuffer(targets.msDepth);
        gl.deleteFramebuffer(targets.msFBO); gl.deleteTexture(targets.hdr); gl.deleteFramebuffer(targets.hdrFBO);
        targets.bloom.forEach(b => { gl.deleteTexture(b.tex); gl.deleteFramebuffer(b.fbo); });
        gl.deleteTexture(targets.refl); gl.deleteFramebuffer(targets.reflFBO); gl.deleteRenderbuffer(targets.reflDepth);
    }
    const samples = Math.min(4, gl.getParameter(gl.MAX_SAMPLES));
    const msColor = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, msColor);
    gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, gl.RGBA16F, w, h);
    const msDepth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, msDepth);
    gl.renderbufferStorageMultisample(gl.RENDERBUFFER, samples, gl.DEPTH_COMPONENT24, w, h);
    const msFBO = gl.createFramebuffer();
    gl.bindFramebuffer(gl.FRAMEBUFFER, msFBO);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.RENDERBUFFER, msColor);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, msDepth);

    const hdr = makeTex(w, h, { wrap: gl.CLAMP_TO_EDGE });
    const hdrFBO = makeFBO([hdr]);

    const bloom = [];
    let bw = w, bh = h;
    for (let i = 0; i < 6; i++) {
        bw = Math.max(1, bw >> 1); bh = Math.max(1, bh >> 1);
        const tex = makeTex(bw, bh, { wrap: gl.CLAMP_TO_EDGE });
        bloom.push({ tex, fbo: makeFBO([tex]), w: bw, h: bh });
    }
    // Half-resolution planar reflection target (boat mirrored in the sea)
    const rw = Math.max(1, w >> 1), rh = Math.max(1, h >> 1);
    const refl = makeTex(rw, rh, { wrap: gl.CLAMP_TO_EDGE });
    const reflFBO = makeFBO([refl]);
    const reflDepth = gl.createRenderbuffer();
    gl.bindRenderbuffer(gl.RENDERBUFFER, reflDepth);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, rw, rh);
    gl.framebufferRenderbuffer(gl.FRAMEBUFFER, gl.DEPTH_ATTACHMENT, gl.RENDERBUFFER, reflDepth);
    targets = { w, h, msColor, msDepth, msFBO, hdr, hdrFBO, bloom, refl, reflFBO, reflDepth };
}
